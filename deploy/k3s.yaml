apiVersion: v1
kind: Namespace
metadata:
  name: smoking-room
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoking-room-data
  namespace: smoking-room
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoking-room
  namespace: smoking-room
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smoking-room
  template:
    metadata:
      labels:
        app: smoking-room
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: jerryhwang-16z90p-oa76k
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: docker.io/library/smoking-room:k3s-20260913-loading-v16
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smoking-room-data
---
apiVersion: v1
kind: Service
metadata:
  name: smoking-room
  namespace: smoking-room
spec:
  selector:
    app: smoking-room
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smoking-room
  namespace: smoking-room
  annotations:
    tailscale.com/funnel: 'true'
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - smoking-room
  defaultBackend:
    service:
      name: smoking-room
      port:
        number: 80
